---
# Global variables for all hosts

# Timezone setting
timezone: "UTC"

# NTP servers
ntp_servers:
  - "pool.ntp.org"
  - "time.nist.gov"

# Common packages to install
common_packages:
  - vim
  - curl
  - wget
  - git
  - htop

# SSH settings
ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
