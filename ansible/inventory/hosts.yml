---
all:
  children:
    proxmox:
      hosts:
        pve-thinkpad:
          ansible_host: 192.168.16.7
          ansible_user: root
          ansible_port: 22
          ansible_python_interpreter: /usr/bin/python3
          # Server-specific notes
          # Hostname: pve-thinkpad
          # Has existing /root/proxmox-homelab directory

        pve2:
          ansible_host: 192.168.17.1
          ansible_user: root
          ansible_port: 22
          ansible_python_interpreter: /usr/bin/python3
          # Server-specific notes
          # Second Proxmox server

      vars:
        # Proxmox API settings
        proxmox_api_user: "root@pam"
        # proxmox_api_password: "{{ vault_proxmox_password }}"
        # proxmox_api_token_id: "{{ vault_proxmox_token_id }}"
        # proxmox_api_token_secret: "{{ vault_proxmox_token_secret }}"

        # Common settings
        timezone: "Europe/Berlin"
        ntp_servers:
          - "pool.ntp.org"
          - "time.nist.gov"
